# Las clases de prueba se ejecutan en orden alfabetico (T01..T08) porque los
# datos que crea una clase son la precondicion de la siguiente.
junit.jupiter.testclass.order.default = org.junit.jupiter.api.ClassOrderer$ClassName

# Dentro de cada clase, los casos se ejecutan en el orden indicado con @Order.
junit.jupiter.testmethod.order.default = org.junit.jupiter.api.MethodOrderer$OrderAnnotation

# Nombres legibles en el informe (se usa @DisplayName con el identificador CP-xx).
junit.jupiter.displayname.generator.default = org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores
