<div class="profile-container fade-in-up">
  <div class="profile-card">
    <h1>Modificar Perfil</h1>
    
    <div *ngIf="message" class="message-box" [class.success]="messageType === 'success'" [class.error]="messageType === 'error'">
      {{ message }}
    </div>

    <form (ngSubmit)="updateProfile()" class="profile-form">
      <div class="form-row">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" [(ngModel)]="user.full_name" name="full_name" required>
        </div>
        <div class="form-group">
          <label>Cédula</label>
          <input type="text" [(ngModel)]="user.cedula" name="cedula" required>
        </div>
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="user.email" name="email" required>
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" [(ngModel)]="user.phone" name="phone" required>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </form>
  </div>
</div>
