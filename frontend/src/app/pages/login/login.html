<div class="login-container">
  <div class="login-card">
    <div class="text-center" style="margin-bottom: 2rem;">
      <img src="/LOGO.png" alt="Logo Turnify" class="logo-img" />
      <h2>Iniciar Sesión</h2>
      <p class="subtitle text-muted">Bienvenido a Turnify Pro</p>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Usuario o Correo</label>
        <input type="text" [(ngModel)]="username" name="username" class="form-control" placeholder="Ingresa tu usuario o correo" required />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required />
      </div>

      <div *ngIf="error" class="alert alert-error">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary btn-lg" [disabled]="loading" style="margin-top: 0.5rem;">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
    <div class="login-links">
      ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
    </div>
  </div>
</div>
