<nav class="navbar">
  <div class="navbar-container">
    <a routerLink="/home" class="navbar-brand" style="text-decoration: none;">
      <img src="/LOGO.png" alt="Logo" class="navbar-logo" />
      <img src="/NOMBRE_Y_ESLOGAN.png" alt="Nombre y Eslogan" class="navbar-title-img" />
    </a>

    <div class="navbar-clock">
      <svg class="navbar-clock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <div class="navbar-clock-text">
        <span class="navbar-clock-time">{{ timer }}</span>
        <span class="navbar-clock-date">{{ dateLabel }}</span>
      </div>
    </div>

    <div class="navbar-menu" *ngIf="isClient()">
      <a routerLink="/home" class="navbar-link">Inicio</a>
      <a routerLink="/profile" class="navbar-link">Perfil</a>
      <a routerLink="/my-turns" class="navbar-link">Mis Turnos</a>
      <button (click)="logout()" class="navbar-logout-btn">Salir</button>
    </div>

    <div class="navbar-menu" *ngIf="isEmployee()">
      <a routerLink="/employee" class="navbar-link">Panel</a>
      <a routerLink="/virtual-turns" class="navbar-link">Turnos Virtuales</a>
      <a routerLink="/manage-users" class="navbar-link">Usuarios</a>
      <a routerLink="/reschedule-turns" class="navbar-link">Reagendar</a>
      <button (click)="logout()" class="navbar-logout-btn">Salir</button>
    </div>

    <div class="navbar-menu" *ngIf="isAdmin()">
      <a routerLink="/dashboard" class="navbar-link">Dashboard</a>
      <a routerLink="/home" class="navbar-link">Turnos</a>
      <a routerLink="/manage-users" class="navbar-link">Usuarios</a>
      <a routerLink="/screen" class="navbar-link">Pantalla</a>
      <button (click)="logout()" class="navbar-logout-btn">Salir</button>
    </div>
  </div>
</nav>
